services:
  # 1. Reverse Proxy Gateway (Edge Router, Rate Limiter; TLS 443 terminated upstream and forwarded to port 80)
  gateway:
    container_name: shelfstack-gateway-prod
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - order-service
    networks:
      - shelfstack-prod-net
    restart: always

  # 2. Nuxt 4 Frontend & Nitro App Server
  frontend:
    container_name: shelfstack-frontend-prod
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_SUPABASE_URL=${NUXT_PUBLIC_SUPABASE_URL:-}
      - NUXT_PUBLIC_SUPABASE_KEY=${NUXT_PUBLIC_SUPABASE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - NUXT_PUBLIC_MIDTRANS_CLIENT_KEY=${NUXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      - NUXT_PUBLIC_ENABLE_MIDTRANS_SANDBOX=${NUXT_PUBLIC_ENABLE_MIDTRANS_SANDBOX:-false}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-}
      - APP_URL=${APP_URL:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - TRUST_PROXY=true
      - ORDER_SERVICE_URL=http://order-service:4000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - order-service
      - redis
    networks:
      - shelfstack-prod-net
    restart: always

  # 3. Fastify Order Service Pilot
  order-service:
    container_name: shelfstack-order-service-prod
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    expose:
      - '4000'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - SUPABASE_URL=${NUXT_PUBLIC_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
      - REDIS_URL=redis://redis:6379
      - BULLMQ_ENABLED=true
      - ORDER_EXPIRY_MINUTES=${ORDER_EXPIRY_MINUTES:-120}
      - ORDER_SWEEP_INTERVAL_MS=${ORDER_SWEEP_INTERVAL_MS:-300000}
    depends_on:
      - redis
    networks:
      - shelfstack-prod-net
    restart: always

  # 4. In-Memory Cache (Redis 7)
  redis:
    container_name: shelfstack-redis-prod
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - '6379'
    volumes:
      - redis-prod-data:/data
    networks:
      - shelfstack-prod-net
    restart: always

networks:
  shelfstack-prod-net:
    driver: bridge

volumes:
  redis-prod-data:
    driver: local
