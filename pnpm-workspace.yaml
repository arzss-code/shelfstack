packages:
  - '.'
  - 'services/*'

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@e2e-dev/web@0.13.0'
  - e2e@0.18.0
  - '@nuxt/fonts@1.2.1'
  - fontaine@1.1.0
  - fontless@1.4.0

overrides:
  '@simple-git/argv-parser': '>=2.0.1'
  '@nuxt/devtools': '~3.4.4'
  simple-git: '>=4.0.1'
  tinypool: '>=2.1.2'
  shell-quote: '>=1.11.0'
  sharp: '>=0.35.5'
  undici@7: '^7.30.2'
  undici@8: '^8.12.4'
  js-yaml: '^4.3.2'
  fast-uri@3: '^3.1.9'
  fast-uri@4: '^4.2.3'
  node-forge: '>=1.4.1'
  serialize-javascript: '>=7.1.3'
  'vue': '3.5.45'
  '@vue/server-renderer': '3.5.45'
  '@vue/runtime-core': '3.5.45'
  '@vue/runtime-dom': '3.5.45'
  '@vue/compiler-core': '3.5.45'
  '@vue/compiler-dom': '3.5.45'
  '@vue/compiler-sfc': '3.5.45'
  '@vue/compiler-ssr': '3.5.45'
  '@vue/reactivity': '3.5.45'
  '@vue/shared': '3.5.45'
  brace-expansion@1: '^1.1.21'
  brace-expansion@2: '^2.1.7'
  brace-expansion@5: '^5.0.12'
  devalue: '^5.9.4'
  happy-dom: '>=21.0.4'
  launch-editor: '>=2.14.2'
  seroval: '>=1.6.8'
  source-map-js: '>=1.2.2'
  svgo: '>=4.1.0'
  vite: '>=8.2.4'
  zod: '^4.6.7'
  'h3@1': '>=1.15.11'
  'postcss-selector-parser@6': '^6.1.6'
  'postcss-selector-parser@7': '^7.2.1'
  'glob@>=9': '>=14.0.2'
  'minimatch@>=7': '>=11.0.1'
  'eslint-plugin-import-x': '>=4.18.1'
