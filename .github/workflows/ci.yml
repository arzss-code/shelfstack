name: CI/CD Pipeline - ShelfStack

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Typecheck Root Nuxt App
        run: pnpm typecheck

      - name: Typecheck Order Service
        run: pnpm --filter @shelfstack/order-service typecheck

      - name: Verify Production Build
        run: pnpm build

  test-suites:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Root Vitest Suite (Nuxt & Domain Tests)
        run: pnpm vitest run

      - name: Run Standalone Order Service Tests (Fastify & Redis)
        run: pnpm --filter @shelfstack/order-service test

  infrastructure-validation:
    name: Docker & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configs
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f deploy/docker-compose.prod.yml config --quiet

  e2e-playwright:
    name: End-to-End Playwright Suite
    runs-on: ubuntu-latest
    needs: test-suites
    timeout-minutes: 30
    environment: ShelfStack
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUXT_SUPABASE_SECRET_KEY }}
      MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
      NUXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NUXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Production Bundle
        run: pnpm build

      - name: Run Playwright Suite
        run: pnpm test:e2e
